<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="goldRing" cx="50%" cy="35%" r="60%">
      <stop offset="0%"   stop-color="#FFF0A0"/>
      <stop offset="30%"  stop-color="#D4A017"/>
      <stop offset="55%"  stop-color="#F5C842"/>
      <stop offset="75%"  stop-color="#B8860B"/>
      <stop offset="90%"  stop-color="#E8B800"/>
      <stop offset="100%" stop-color="#A07800"/>
    </radialGradient>
    <clipPath id="innerCircle">
      <circle cx="100" cy="100" r="76"/>
    </clipPath>
  </defs>

  <!-- Outer gold ring -->
  <circle cx="100" cy="100" r="98" fill="url(#goldRing)" stroke="#8B6914" stroke-width="1"/>

  <!-- White inner circle -->
  <circle cx="100" cy="100" r="76" fill="#FFFFFF"/>

  <!-- Thin gold inner border -->
  <circle cx="100" cy="100" r="76" fill="none" stroke="#C9A227" stroke-width="2"/>

  <!-- RAPHEL text -->
  <text
    x="100" y="105"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="42"
    font-weight="bold"
    fill="#B22020"
    text-anchor="middle"
    dominant-baseline="middle"
    letter-spacing="2">RAPHEL</text>

  <!-- Decorative line above PRINTERS -->
  <line x1="38" y1="118" x2="162" y2="118" stroke="#C9A227" stroke-width="1.2"/>

  <!-- PRINTERS text -->
  <text
    x="100" y="132"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="14"
    font-weight="bold"
    fill="#1A1A1A"
    text-anchor="middle"
    dominant-baseline="middle"
    letter-spacing="3.5">PRINTERS</text>

  <!-- Decorative line below PRINTERS -->
  <line x1="38" y1="145" x2="162" y2="145" stroke="#C9A227" stroke-width="1.2"/>

  <!-- Est. text -->
  <text
    x="100" y="156"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="8.5"
    fill="#555555"
    text-anchor="middle"
    dominant-baseline="middle"
    letter-spacing="1.5">PROFESSIONAL &amp; TRUSTWORTHY · EST. 1996</text>
</svg>
